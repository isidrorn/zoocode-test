spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/event_aggregator?search_path=public
    username: event_aggregator
    password: event_aggregator
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      use-new-id-generator-mappings: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration
